<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Lennox Lewis favicon</title>
  <desc id="desc">A dark rounded favicon with a clean cool white LL monogram and subtle cyan accent.</desc>
  <defs>
    <linearGradient id="frame" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.55" stop-color="#d9ecff" />
      <stop offset="1" stop-color="#839cb5" />
    </linearGradient>
    <linearGradient id="monogram" x1="16" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.45" stop-color="#d9ecff" />
      <stop offset="1" stop-color="#b4cde1" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.34" r="0.72">
      <stop offset="0" stop-color="#62e0ff" stop-opacity="0.22" />
      <stop offset="0.55" stop-color="#62e0ff" stop-opacity="0.06" />
      <stop offset="1" stop-color="#62e0ff" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="#0e0e10" />
  <rect width="64" height="64" rx="16" fill="url(#glow)" />
  <rect x="8" y="8" width="48" height="48" rx="12.5" fill="none" stroke="url(#frame)" stroke-width="1.1" />
  <rect x="11" y="11" width="42" height="42" rx="11" fill="#101114" stroke="#ffffff10" stroke-width="0.8" />

  <g fill="none" stroke="url(#monogram)" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M22.5 18.5v27h10" stroke-width="4.1" />
    <path d="M38.5 18.5v27h8" stroke-width="4.1" />
  </g>

  <path d="M39.5 17.8h4.2" stroke="#62e0ff" stroke-width="1.2" stroke-linecap="round" opacity="0.65" />
</svg>
