<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Lennox Lewis favicon</title>
  <desc id="desc">A premium dark favicon with a metallic gold LL monogram.</desc>
  <defs>
    <linearGradient id="gold" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8e7a6" />
      <stop offset="0.42" stop-color="#d4af37" />
      <stop offset="1" stop-color="#8f6a16" />
    </linearGradient>
    <linearGradient id="goldEdge" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f3dd8a" stop-opacity="0.95" />
      <stop offset="0.5" stop-color="#d4af37" stop-opacity="0.8" />
      <stop offset="1" stop-color="#6f5312" stop-opacity="0.75" />
    </linearGradient>
    <filter id="goldGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="7" y="7" width="50" height="50" rx="16" fill="#101114" />
  <rect x="8" y="8" width="48" height="48" rx="15" fill="none" stroke="url(#goldEdge)" stroke-width="1.5" />

  <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <path
      d="M22 18v28h12"
      stroke="url(#gold)"
      stroke-width="6"
      filter="url(#goldGlow)"
    />
    <path
      d="M38 18v22h8"
      stroke="url(#gold)"
      stroke-width="6"
      filter="url(#goldGlow)"
    />
  </g>
</svg>
