<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="rim" cx="0.4" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#e6e7ec"/>
      <stop offset="1" stop-color="#b9bbc4"/>
    </radialGradient>
    <radialGradient id="well" cx="0.45" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#f7f7f9"/>
      <stop offset="1" stop-color="#d9dae0"/>
    </radialGradient>
  </defs>
  <!-- ceramic rim -->
  <circle cx="256" cy="256" r="244" fill="url(#rim)"/>
  <circle cx="256" cy="256" r="242" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3"/>
  <!-- brand band -->
  <circle cx="256" cy="256" r="214" fill="none" stroke="#8B5CF6" stroke-width="16"/>
  <!-- inner well with a soft step down -->
  <circle cx="256" cy="256" r="186" fill="#a9abb5" fill-opacity="0.55"/>
  <circle cx="256" cy="260" r="180" fill="url(#well)"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#000000" stroke-opacity="0.08" stroke-width="4"/>
  <!-- logo -->
  <image x="161" y="161" width="190" height="190" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64,"/>
</svg>
